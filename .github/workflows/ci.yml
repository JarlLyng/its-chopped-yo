# The three checks that keep iOS and Android writing the same bytes (specs/audio-processing.md):
#
# 1. reference: rebuilds testdata/ from the spec on Linux x86_64 and fails if anything differs from
#    what was committed (made on an arm64 Mac). This is the check across CPU architectures.
# 2. swift: the Swift core against every case, a build of the package for iOS devices, and a
#    build of the iOS app (ios/App, generated with XcodeGen) for the simulator.
# 3. kotlin: the Kotlin core against every case on the JVM (with a host build of libsamplerate),
#    then the NDK build of the Android library and the Android app.
#
# The device test (android/core/src/androidTest) needs an emulator or a phone and runs locally:
# ./gradlew :core:connectedDebugAndroidTest. Both apps also have a self-test in Settings.
#
# GitHub's own actions stay on a tag; third-party actions would be pinned to a commit SHA
# (PROJECT_STANDARDS.md section 4 in the hub). There are none here.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    name: Reference and test files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Rebuild the expected files from the spec
        run: python3 tools/make_testdata.py
      - name: The committed test files are what the spec gives on this machine
        run: |
          git status --porcelain -- testdata
          git diff --exit-code -- testdata
          test -z "$(git status --porcelain -- testdata)"

  swift:
    name: Swift core
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tests (every case in testdata/cases.json)
        run: swift test
      - name: Build for iOS devices
        run: xcodebuild -scheme ChoppedCore -destination 'generic/platform=iOS' build -quiet
      - name: Build the iOS app for the simulator
        run: |
          brew install xcodegen
          cd ios/App
          xcodegen generate
          xcodebuild -project ItsChoppedYo.xcodeproj -scheme ItsChoppedYo \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build -quiet

  kotlin:
    name: Kotlin core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Tests on the JVM (every case in testdata/cases.json)
        run: ./gradlew :core:testDebugUnitTest --console=plain
      - name: NDK build of the Android library, and the Android app
        run: ./gradlew :core:assembleDebug :app:assembleDebug --console=plain
